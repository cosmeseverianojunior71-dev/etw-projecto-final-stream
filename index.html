<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>ETW — Filmes, Séries e Doramas</title>

<style>
:root{
  --bg:#111111;
  --line:rgba(255,255,255,.09);
  --txt:#f5f5f5;
  --txt-2:#b3b3b3;
  --txt-3:#7c7c7c;
  --red:#e50914;
  --red-2:#ff1f2b;
  --hdr:64px;
  --radius:10px;
  --radius-lg:16px;
  --shadow:0 18px 48px rgba(0,0,0,.62);
  --ease:cubic-bezier(.22,.61,.36,1);
  --maxw:1600px;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size:15px; line-height:1.5; overflow-x:hidden;
}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* Cabeçalho */
.hdr{
  position:fixed;inset:0 0 auto 0;z-index:60;height:var(--hdr);
  display:flex;align-items:center;gap:14px;padding:0 clamp(12px,3vw,32px);
  background:rgba(10,10,10,.97);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(12px);
}
.logo{font-weight:900;font-size:26px;color:var(--red);text-transform:uppercase;letter-spacing:.06em}
.logo b{color:#fff}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.05);padding:4px;border-radius:99px;border:1px solid var(--line)}
.tab{padding:7px 15px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--txt-2);transition:.2s}
.tab[aria-selected="true"]{background:var(--red);color:#fff}
.spacer{flex:1 1 auto}

/* Busca */
.searchwrap{position:relative;flex:0 1 340px}
.searchbox{display:flex;align-items:center;gap:8px;background:rgba(12,12,12,.9);border:1px solid var(--line);border-radius:99px;padding:0 12px;height:38px}
.searchbox input{flex:1;background:none;border:0;outline:0;font-size:14px;color:#fff}
.ac{position:absolute;top:calc(100% + 8px);right:0;left:0;z-index:70;background:#151515;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:400px;overflow:auto;display:none}
.ac.show{display:block}
.ac-item{display:flex;gap:10px;padding:8px 10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.ac-item:hover{background:rgba(229,9,20,.14)}
.ac-item img{width:38px;height:57px;object-fit:cover;border-radius:5px}

/* Main & Cards */
main{padding-top:var(--hdr)}
.hero{position:relative;height:50vh;min-height:360px;display:flex;align-items:flex-end;background:#0a0a0a;overflow:hidden}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.hero-in{position:relative;z-index:2;padding:30px;max-width:var(--maxw);margin:0 auto;width:100%}
.hero-title{font-size:clamp(28px,5vw,52px);margin:0 0 10px;font-weight:900}

.content{max-width:var(--maxw);margin:0 auto;padding:20px}
.row{margin-bottom:30px}
.row-t{font-size:20px;font-weight:800;margin-bottom:12px}
.row-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.card{flex:0 0 auto;width:160px;cursor:pointer;transition:transform .2s}
.card:hover{transform:scale(1.05)}
.card-poster{aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:#222;border:1px solid var(--line)}
.card-poster img{width:100%;height:100%;object-fit:cover}
.card-t{margin-top:8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Modal / Player */
.modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);padding:20px;overflow-y:auto}
.modal.show{display:block}
.sheet{position:relative;max-width:960px;margin:20px auto;background:#141414;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.close-x{position:absolute;top:10px;right:10px;z-index:20;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:20px}

.player-wrap{position:relative;background:#000;aspect-ratio:16/9;width:100%}
.player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#111}
.big-play{width:64px;height:64px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:24px;margin:0 auto 10px;cursor:pointer}

.player-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0d0d0d;border-bottom:1px solid var(--line)}
select.sel{background:#1e1e1e;border:1px solid var(--line);color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;outline:0}

.sheet-body{padding:20px}
.ep-list{margin-top:15px;max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:#0e0e0e}
.ep{padding:10px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;display:flex;gap:10px}
.ep:hover{background:rgba(229,9,20,.15)}

.btn{padding:10px 20px;border-radius:8px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn-play{background:#fff;color:#000}

/* Configurações */
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;margin-bottom:5px;color:var(--txt-2)}
.field input{width:100%;background:#1e1e1e;border:1px solid var(--line);padding:10px;border-radius:8px;color:#fff}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">E<b>T</b>W</div>
  <nav class="tabs">
    <button class="tab" data-tab="movie" aria-selected="true">Filmes</button>
    <button class="tab" data-tab="tv" aria-selected="false">Séries</button>
  </nav>
  <div class="spacer"></div>
  <div class="searchwrap">
    <div class="searchbox">
      <input id="q" type="search" placeholder="Buscar..." autocomplete="off">
    </div>
    <div class="ac" id="ac"></div>
  </div>
  <button id="setBtn" style="font-size:20px">⚙️</button>
</header>

<main>
  <section class="hero" id="hero"></section>
  <div class="content">
    <div id="rows"></div>
  </div>
</main>

<!-- MODAL PLAYER -->
<div class="modal" id="detailModal">
  <div class="sheet">
    <button class="close-x" id="closeDetail">&times;</button>
    
    <div class="player-wrap" id="playerWrap">
      <div class="player-ph">
        <div>
          <div class="big-play" id="phPlay">&#9654;</div>
          <h3>Clique no Play para assistir</h3>
        </div>
      </div>
    </div>

    <div class="player-bar">
      <div>
        <h4 id="pTitle" style="margin:0">—</h4>
        <small id="pSub" style="color:var(--txt-3)">Selecione um título</small>
      </div>
      <div style="display:flex;gap:8px">
        <select class="sel" id="seasonSel" hidden></select>
        <select class="sel" id="serverSel">
          <option value="warez">Servidor Warez (PT-BR)</option>
          <option value="autoembed">Servidor Autoembed (Multi)</option>
          <option value="vidsrc">Servidor Vidsrc (Inglês)</option>
        </select>
      </div>
    </div>

    <div class="sheet-body">
      <h2 id="dTitle" style="margin:0 0 10px"></h2>
      <p id="dOverview" style="color:var(--txt-2);font-size:14px"></p>
      <div class="ep-list" id="epListZone" hidden>
        <div id="epScroll"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL CONFIGS -->
<div class="modal" id="setModal">
  <div class="sheet" style="max-width:400px;padding:20px">
    <button class="close-x" id="closeSet">&times;</button>
    <h3>Configurações</h3>
    <div class="field">
      <label for="inKey">Chave API (TMDB v3)</label>
      <input type="password" id="inKey">
    </div>
    <button class="btn btn-play" id="saveSet" style="width:100%;justify-content:center">Salvar</button>
  </div>
</div>

<script>
(function () {
'use strict';

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

const DEMO_KEY = '3fd2be6f0c70a2a598f084ddfb75487c';
const API = 'https://api.themoviedb.org/3';
const IMG = 'https://image.tmdb.org/t/p/';

const state = {
  tab: localStorage.getItem('etw_tab') || 'movie',
  apiKey: localStorage.getItem('etw_key') || DEMO_KEY,
  current: null,
  s: 1, e: 1
};

async function tmdb(path, params) {
  const u = new URL(API + path);
  u.searchParams.set('api_key', state.apiKey);
  u.searchParams.set('language', 'pt-BR');
  if (params) Object.keys(params).forEach(k => u.searchParams.set(k, params[k]));
  const r = await fetch(u.toString());
  if (!r.ok) throw new Error('Erro API');
  return await r.json();
}

function openModal(m) { m.classList.add('show'); document.body.classList.add('locked'); }
function closeModal(m) { m.classList.remove('show'); document.body.classList.remove('locked'); }

function init() {
  $('#inKey').value = state.apiKey;
  setupEvents();
  loadTab(state.tab);
}

function setupEvents() {
  $$('.tab').forEach(b => {
    b.addEventListener('click', () => {
      $$('.tab').forEach(x => x.setAttribute('aria-selected', 'false'));
      b.setAttribute('aria-selected', 'true');
      state.tab = b.dataset.tab;
      localStorage.setItem('etw_tab', state.tab);
      loadTab(state.tab);
    });
  });

  $('#setBtn').addEventListener('click', () => openModal($('#setModal')));
  $('#closeSet').addEventListener('click', () => closeModal($('#setModal')));
  $('#closeDetail').addEventListener('click', () => closeModal($('#detailModal')));
  
  $('#saveSet').addEventListener('click', () => {
    const k = $('#inKey').value.trim();
    if(k) { state.apiKey = k; localStorage.setItem('etw_key', k); }
    closeModal($('#setModal'));
    loadTab(state.tab);
  });

  $('#phPlay').addEventListener('click', playMedia);
  $('#serverSel').addEventListener('change', () => {
    if ($('#playerWrap iframe')) playMedia();
  });

  let timer;
  $('#q').addEventListener('input', (e) => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if(!q) { $('#ac').classList.remove('show'); return; }
    timer = setTimeout(() => search(q), 300);
  });
}

async function search(q) {
  try {
    const res = await tmdb('/search/multi', { query: q });
    const ac = $('#ac');
    ac.innerHTML = '';
    (res.results || []).slice(0, 6).forEach(item => {
      if(!item.poster_path) return;
      const d = el('div', 'ac-item', `<img src="${IMG}w92${item.poster_path}"><div><div><b>${item.title || item.name}</b></div></div>`);
      d.addEventListener('click', () => {
        ac.classList.remove('show');
        openDetail(item.media_type || 'movie', item.id, item);
      });
      ac.appendChild(d);
    });
    ac.classList.add('show');
  } catch(e) {}
}

async function loadTab(tab) {
  const rows = $('#rows');
  rows.innerHTML = '';
  try {
    const trend = await tmdb(`/trending/${tab}/week`);
    renderHero(trend.results[0]);
    renderRow('Em alta nesta semana', trend.results);

    const popular = await tmdb(`/${tab}/popular`);
    renderRow('Mais Populares', popular.results);
  } catch(e) {
    rows.innerHTML = '<p style="text-align:center;padding:40px">Chave API inválida ou erro ao carregar catálogo.</p>';
  }
}

function renderHero(item) {
  if(!item) return;
  const h = $('#hero');
  h.innerHTML = `
    <img class="hero-bg" src="${IMG}original${item.backdrop_path}">
    <div class="hero-in">
      <h1 class="hero-title">${item.title || item.name}</h1>
      <button class="btn btn-play" id="hPlay">&#9654; Assistir Agora</button>
    </div>
  `;
  $('#hPlay').addEventListener('click', () => openDetail(state.tab, item.id, item));
}

function renderRow(title, items) {
  const sec = el('section', 'row', `<div class="row-t">${title}</div><div class="row-scroll"></div>`);
  const sc = $('.row-scroll', sec);
  items.forEach(it => {
    if(!it.poster_path) return;
    const card = el('div', 'card', `
      <div class="card-poster"><img src="${IMG}w342${it.poster_path}"></div>
      <div class="card-t">${it.title || it.name}</div>
    `);
    card.addEventListener('click', () => openDetail(state.tab, it.id, it));
    sc.appendChild(card);
  });
  $('#rows').appendChild(sec);
}

async function openDetail(type, id, preview) {
  state.current = { type, id, preview };
  state.s = 1; state.e = 1;
  
  $('#dTitle').textContent = preview.title || preview.name;
  $('#dOverview').textContent = preview.overview || 'Sem descrição disponível.';
  
  // Reseta Player
  $('#playerWrap').innerHTML = `
    <div class="player-ph">
      <div>
        <div class="big-play" id="phPlay">&#9654;</div>
        <h3>Clique para carregar o player</h3>
      </div>
    </div>`;
  $('#phPlay').addEventListener('click', playMedia);

  openModal($('#detailModal'));

  if(type === 'tv') {
    $('#seasonSel').hidden = false;
    $('#epListZone').hidden = false;
    loadSeasons(id);
  } else {
    $('#seasonSel').hidden = true;
    $('#epListZone').hidden = true;
  }
}

async function loadSeasons(id) {
  try {
    const data = await tmdb(`/tv/${id}`);
    const sel = $('#seasonSel');
    sel.innerHTML = '';
    (data.seasons || []).forEach(s => {
      if(s.season_number > 0) {
        sel.innerHTML += `<option value="${s.season_number}">Temporada ${s.season_number}</option>`;
      }
    });
    sel.onchange = (e) => loadEpisodes(id, e.target.value);
    loadEpisodes(id, 1);
  } catch(e) {}
}

async function loadEpisodes(id, season) {
  state.s = season;
  try {
    const data = await tmdb(`/tv/${id}/season/${season}`);
    const epScroll = $('#epScroll');
    epScroll.innerHTML = '';
    (data.episodes || []).forEach(ep => {
      const d = el('div', 'ep', `
        <b>Ep. ${ep.episode_number}</b>
        <span>${ep.name}</span>
      `);
      d.addEventListener('click', () => {
        state.e = ep.episode_number;
        playMedia();
      });
      epScroll.appendChild(d);
    });
  } catch(e) {}
}

function playMedia() {
  if (!state.current) return;
  const c = state.current;
  const server = $('#serverSel').value;
  let url = '';

  // Constrói as URLs de acordo com o servidor selecionado
  if (server === 'warez') {
    // Servidor focado em conteúdo PT-BR
    if (c.type === 'movie') {
      url = `https://embed.warezcdn.net/filme/${c.id}`;
    } else {
      url = `https://embed.warezcdn.net/serie/${c.id}/${state.s}/${state.e}`;
    }
  } else if (server === 'autoembed') {
    // Servidor internacional com opção de idioma PT-BR
    if (c.type === 'movie') {
      url = `https://player.autoembed.cc/embed/movie/${c.id}?lang=pt-BR`;
    } else {
      url = `https://player.autoembed.cc/embed/tv/${c.id}/${state.s}/${state.e}?lang=pt-BR`;
    }
  } else if (server === 'vidsrc') {
    // Servidor Vidsrc padrão
    if (c.type === 'movie') {
      url = `https://vidsrc.to/embed/movie/${c.id}`;
    } else {
      url = `https://vidsrc.to/embed/tv/${c.id}/${state.s}/${state.e}`;
    }
  }

  // Renderiza o player com as permissões corretas ativadas
  $('#playerWrap').innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
  $('#pTitle').textContent = c.preview.title || c.preview.name;
  $('#pSub').textContent = c.type === 'tv' ? `Temporada ${state.s} • Episódio ${state.e}` : 'Filme';
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
